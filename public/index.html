<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - Login & Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-100">
        
        <!-- Login / Sign up Section (ပထမဆုံးပေါ်မည်) -->
        <div id="authSection">
            <h2 id="formTitle" class="text-2xl font-bold mb-6 text-center text-slate-900">User Login</h2>
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <button type="submit" id="submitBtn" class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-medium hover:bg-slate-800 transition">Login</button>
            </form>
            <p id="authError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
            
            <div class="mt-6 text-center text-sm text-slate-500">
                <span id="switchText">အကောင့်မရှိသေးပါဘူးလား?</span>
                <button type="button" onclick="toggleMode()" id="switchBtn" class="text-indigo-600 font-medium underline ml-1">Sign up လုပ်ရန်</button>
            </div>
        </div>

        <!-- User Dashboard & Digital Pay Information Box (အကောင့်ဝင်ပြီးမှသာ ပေါ်မည်) -->
        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-slate-900">User Dashboard</h1>
                <button onclick="handleLogout()" class="text-sm text-red-600 hover:underline">Logout</button>
            </div>

            <!-- Digital Pay Information Box -->
            <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 mb-6">
                <h2 class="text-lg font-bold text-slate-900 mb-1">Digital Pay Information</h2>
                <p class="text-xs text-slate-500 mb-4">လက်ရှိ သတ်မှတ်ထားသော အချက်အလက်များ</p>
                
                <div class="space-y-3 text-left">
                    <div class="p-3 bg-white rounded-xl border border-slate-100">
                        <span class="block text-xs font-medium text-slate-400">Deposit နှုန်းထား</span>
                        <span id="viewDeposit" class="text-base font-bold text-slate-800">-</span>
                    </div>
                    <div class="p-3 bg-white rounded-xl border border-slate-100">
                        <span class="block text-xs font-medium text-slate-400">ဂဏန်းအချက်အလက်</span>
                        <span id="viewNumber" class="text-base font-bold text-indigo-600">-</span>
                    </div>
                    <div class="text-xs text-slate-400 text-right">
                        နောက်ဆုံးပြင်ဆင်ချိန်: <span id="viewTime">-</span>
                    </div>
                </div>
            </div>

            <div class="pt-2 text-center text-xs text-slate-500">
                ဆက်သွယ်ရန် Admin: <a href="https://t.me/myandigitalpay" target="_blank" class="text-indigo-600 font-medium underline">t.me/myandigitalpay</a>
            </div>
        </div>

    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            const title = document.getElementById('formTitle');
            const btn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchBtn = document.getElementById('switchBtn');
            
            if (isSignup) {
                title.textContent = "User Sign up";
                btn.textContent = "Sign up";
                switchText.textContent = "အကောင့်ရှိပြီးသားလား?";
                switchBtn.textContent = "Login ဝင်ရန်";
            } else {
                title.textContent = "User Login";
                btn.textContent = "Login";
                switchText.textContent = "အကောင့်မရှိသေးပါဘူးလား?";
                switchBtn.textContent = "Sign up လုပ်ရန်";
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            // Login / Signup ဝင်ရောက်ခြင်း အောင်မြင်သည်ဟု ယူဆ၍ Dashboard Box ကို ပြသမည်
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            fetchPublicData();
        }

        function handleLogout() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function fetchPublicData() {
            try {
                const res = await fetch('/api/get-data');
                const data = await res.json();
                document.getElementById('viewDeposit').textContent = data.depositRate;
                document.getElementById('viewNumber').textContent = data.customNumber;
                document.getElementById('viewTime').textContent = data.updatedTime;
            } catch (err) {
                console.error('Data fetch error:', err);
            }
        }
    </script>
</body>
</html>
