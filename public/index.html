<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyanDigitalPay - Rates & Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-100 text-center">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Digital Pay Information</h1>
        <p class="text-sm text-slate-500 mb-6">လက်ရှိ သတ်မှတ်ထားသော အချက်အလက်များ</p>
        <div class="space-y-4 mb-6 text-left">
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                <span class="block text-xs font-medium text-slate-400">Deposit နှုန်းထား</span>
                <span id="viewDeposit" class="text-lg font-bold text-slate-800">-</span>
            </div>
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                <span class="block text-xs font-medium text-slate-400">ဂဏန်းအချက်အလက်</span>
                <span id="viewNumber" class="text-lg font-bold text-indigo-600">-</span>
            </div>
            <div class="text-xs text-slate-400 text-right">
                နောက်ဆုံးပြင်ဆင်ချိန်: <span id="viewTime">-</span>
            </div>
        </div>
        <div class="pt-4 border-t border-slate-100 text-xs text-slate-500">
            ဆက်သွယ်ရန် Admin: <a href="https://t.me/myandigitalpay" target="_blank" class="text-indigo-600 font-medium underline">t.me/myandigitalpay</a>
        </div>
    </div>
    <script>
        async function fetchPublicData() {
            try {
                const res = await fetch('/api/get-data');
                const data = await res.json();
                document.getElementById('viewDeposit').textContent = data.depositRate;
                document.getElementById('viewNumber').textContent = data.customNumber;
                document.getElementById('viewTime').textContent = data.updatedTime;
            } catch (err) {
                console.error('Data fetch error:', err);
            }
        }
        fetchPublicData();
        setInterval(fetchPublicData, 5000);
    </script>
</body>
</html>
