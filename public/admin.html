<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Manual Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-100">
        <div id="loginSection">
            <h2 class="text-2xl font-bold mb-6 text-center text-slate-900">Admin Login</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-medium hover:bg-slate-800 transition">Login</button>
            </form>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-900">Manual Control Panel</h2>
                <a href="/api/logout" class="text-sm text-red-600 hover:underline">Logout</a>
            </div>
            <form onsubmit="handleUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Deposit Manual ပြင်ရန်</label>
                    <input type="text" id="depositRate" required placeholder="ဥပမာ - 1 USD = 4500 MMK" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ဂဏန်းများ Manual ပြင်ရန်</label>
                    <input type="number" step="any" id="customNumber" required placeholder="ဥပမာ - 95000" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-500 transition">Update & Send Telegram</button>
            </form>
            <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 text-center">
                Contact Admin: <a href="https://t.me/myandigitalpay" target="_blank" class="text-indigo-600 underline">t.me/myandigitalpay</a>
            </div>
            <p id="statusMsg" class="text-sm mt-3 text-center hidden"></p>
        </div>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                errorEl.textContent = data.message;
                errorEl.classList.remove('hidden');
            }
        }
        async function handleUpdate(e) {
            e.preventDefault();
            const depositRate = document.getElementById('depositRate').value;
            const customNumber = document.getElementById('customNumber').value;
            const statusEl = document.getElementById('statusMsg');
            const res = await fetch('/api/update-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ depositRate, customNumber })
            });
            const data = await res.json();
            statusEl.classList.remove('hidden');
            if (data.success) {
                statusEl.className = "text-sm mt-3 text-center text-green-600";
                statusEl.textContent = data.message;
            } else {
                statusEl.className = "text-sm mt-3 text-center text-red-600";
                statusEl.textContent = data.message;
            }
        }
    </script>
</body>
</html>
